<!DOCTYPE html>
<html>
<head>
  <title>OnlyDR Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.875rem;
      margin-bottom: 16px;
      transition: border-color 0.15s ease-in-out;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .help-text {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .help-text a {
      color: #6366f1;
      text-decoration: none;
    }
    .help-text a:hover {
      text-decoration: underline;
    }
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s;
    }
    button:hover {
      background-color: #4338ca;
    }
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      font-size: 0.875rem;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Ahrefs API Settings</h2>
    <label for="apiKey">APIv3 Key</label>
    <input type="text" id="apiKey" placeholder="Enter your Ahrefs API Key">
    <div class="help-text">
      Get your free API key from <a href="https://app.ahrefs.com/account/api-keys" target="_blank">Ahrefs Account Settings</a>.
    </div>
    <button id="saveBtn">Save API Key</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
